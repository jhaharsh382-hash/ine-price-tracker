services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: CRON_SECRET
        generateValue: true
      - key: HEADLESS
        value: true
      - key: SCRAPE_MAX_RETRIES
        value: 4
      - key: SCRAPE_TIMEOUT_MS
        value: 20000
      - key: SCRAPE_CONCURRENCY
        value: 3
      - key: DEFAULT_SCRAPE_FREQUENCY_HOURS
        value: 2
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: ine-price-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
